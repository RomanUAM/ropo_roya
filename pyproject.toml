[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roya-cafe"
version = "0.9.1"
description = "Experimentos auditables de presencia y cantidad de roya del café"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn==1.8.0", "networkx>=3.4,<4", "igraph==1.0.0", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4", "matplotlib>=3.9,<4", "tabulate>=0.9", "streamlit>=1.40,<2", "reportlab>=4,<5", "pypdf>=5,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
roya = "roya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
